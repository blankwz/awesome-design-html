<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Templates Gallery · 前台 + 后台 · 74 风格</title>
<style>
  :root { --bg:#0e0f13; --panel:#16181f; --line:#262a35; --text:#e8eaf0; --muted:#8a90a0; --accent:#6c7bff; --accent-2:#9d6cff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,-apple-system,sans-serif; }
  a { color:inherit; text-decoration:none; }

  .topbar { position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:16px; padding:12px 24px;
    background:rgba(14,15,19,.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .logo { font-size:15px; font-weight:700; letter-spacing:-.3px;
    background:linear-gradient(120deg,var(--accent),var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; white-space:nowrap; }
  .count { font-size:12px; color:var(--muted); white-space:nowrap; }
  .search { flex:1; max-width:380px; margin-left:auto; display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:7px 12px; }
  .search input { flex:1; background:none; border:none; outline:none; color:var(--text); font-size:13px; }
  .search input::placeholder { color:var(--muted); }

  .wrap { max-width:1440px; margin:0 auto; padding:24px 24px 64px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:18px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden;
    cursor:pointer; transition:transform .18s ease,border-color .18s ease; }
  .card:hover { transform:translateY(-3px); border-color:#3a4155; }
  .thumb { position:relative; aspect-ratio:4/3; overflow:hidden; background:#fff; }
  .thumb img { position:absolute; top:0; left:0; width:100%; height:auto; display:block; }
  .chip { position:absolute; right:8px; top:8px; z-index:2; display:flex; gap:6px; }
  .chip button { font-size:10px; font-weight:700; letter-spacing:.5px; padding:4px 10px; border-radius:999px;
    border:1px solid rgba(255,255,255,.35); background:rgba(10,11,15,.6); color:#fff; cursor:pointer; backdrop-filter:blur(4px); }
  .chip button.on { background:var(--accent); border-color:var(--accent); }
  .meta { padding:10px 13px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .name { font-size:13px; font-weight:600; }
  .name small { display:block; font-weight:400; font-size:10px; color:var(--muted); margin-top:2px; font-family:ui-monospace,monospace; }
  .num { font-size:10px; color:var(--muted); font-family:ui-monospace,monospace; }
  .hidden { display:none !important; }

  .viewer { position:fixed; inset:0; z-index:100; background:rgba(8,9,12,.94); display:none; flex-direction:column; }
  .viewer.open { display:flex; }
  .vbar { display:flex; align-items:center; gap:12px; padding:10px 20px; border-bottom:1px solid var(--line); background:rgba(14,15,19,.96); }
  .vbar .title { font-size:13px; font-weight:600; }
  .vbar a.src, .vbar button { font-size:12px; color:var(--muted); background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:5px 11px; cursor:pointer; }
  .vbar a.src:hover, .vbar button:hover { color:var(--text); border-color:#3a4155; }
  .vbar .close { margin-left:auto; }
  .vframe { flex:1; }
  .vframe iframe { width:100%; height:100%; border:0; background:#fff; }
  footer { text-align:center; padding:32px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">✦ Templates Gallery · 前台 + 后台</div>
  <div class="count" id="count"></div>
  <div class="search"><input id="q" type="text" placeholder="筛选风格… (stripe / nike / apple)" autocomplete="off"></div>
</header>

<div class="wrap">
  <div class="grid" id="grid"></div>
  <footer>74 风格 × (前台 front.html + 后台 admin.html) · 缩略图为静态截图,点击加载实时页面 · 查看器内 Tab 切换前后台</footer>
</div>

<div class="viewer" id="viewer">
  <div class="vbar">
    <div class="title" id="vTitle"></div>
    <button id="vSwap">切换 前台/后台 (Tab)</button>
    <a class="src" id="vOpen" href="#" target="_blank">新标签打开 ↗</a>
    <button class="close" onclick="closeViewer()">关闭 (Esc)</button>
  </div>
  <div class="vframe"><iframe id="vFrame" title="preview"></iframe></div>
</div>

<script>
const STYLES = ["airbnb","airtable","apple","binance","bmw-m","bmw","bugatti","cal","claude","clay","clickhouse","cohere","coinbase","composio","cursor","dell-1996","elevenlabs","expo","ferrari","figma","framer","hashicorp","hp","ibm","intercom","kraken","lamborghini","linear.app","lovable","mastercard","meta","minimax","mintlify","miro","mistral.ai","mongodb","nike","nintendo-2001","notion","nvidia","ollama","opencode.ai","pinterest","playstation","posthog","raycast","renault","replicate","resend","revolut","runwayml","sanity","sentry","shopify","slack","spacex","spotify","starbucks","stripe","supabase","superhuman","tesla","theverge","together.ai","uber","vercel","vodafone","voltagent","warp","webflow","wired","wise","x.ai","zapier"];
const BRANDS = { "bmw":"BMW","bmw-m":"BMW M","x.ai":"xAI","linear.app":"Linear","mistral.ai":"Mistral AI","opencode.ai":"OpenCode","together.ai":"Together AI","dell-1996":"Dell 1996","nintendo-2001":"Nintendo 2001","theverge":"The Verge" };
const brandOf = s => BRANDS[s] || s.replace(/\b\w/g,c=>c.toUpperCase());

const grid = document.getElementById('grid');
grid.innerHTML = STYLES.map((s,i)=>`
  <div class="card" data-name="${s}" data-style="${s}" data-page="front">
    <div class="thumb">
      <img ${i < 12 ? '' : 'loading="lazy"'} src="_previews/${s}-front.png" alt="${s} front">
      <div class="chip">
        <button class="on" data-p="front">FRONT</button>
        <button data-p="admin">ADMIN</button>
      </div>
    </div>
    <div class="meta">
      <div class="name">${brandOf(s)}<small>${s}</small></div>
      <div class="num">#${String(i+1).padStart(2,'0')}</div>
    </div>
  </div>`).join('');
document.getElementById('count').textContent = STYLES.length + ' styles × 2';

let cur = -1, curPage = 'front';
grid.addEventListener('click', e => {
  const btn = e.target.closest('.chip button');
  const card = e.target.closest('.card');
  if (!card) return;
  if (btn) {
    e.stopPropagation();
    const p = btn.dataset.p;
    card.dataset.page = p;
    card.querySelector('img').src = `_previews/${card.dataset.style}-${p}.png`;
    card.querySelectorAll('.chip button').forEach(b => b.classList.toggle('on', b === btn));
    return;
  }
  cur = STYLES.indexOf(card.dataset.style);
  openViewer(card.dataset.page);
});
function openViewer(p) {
  curPage = p;
  const s = STYLES[cur];
  document.getElementById('vTitle').textContent = `${brandOf(s)} · ${s} · ${p === 'front' ? '前台' : '后台'}`;
  document.getElementById('vOpen').href = `${s}/${p}.html`;
  document.getElementById('vFrame').src = `${s}/${p}.html`;
  document.getElementById('viewer').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeViewer() {
  document.getElementById('viewer').classList.remove('open');
  document.getElementById('vFrame').src = 'about:blank';
  document.body.style.overflow = '';
}
document.getElementById('vSwap').addEventListener('click', () => openViewer(curPage === 'front' ? 'admin' : 'front'));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeViewer();
  if (document.getElementById('viewer').classList.contains('open')) {
    if (e.key === 'Tab') { e.preventDefault(); openViewer(curPage === 'front' ? 'admin' : 'front'); }
    if (e.key === 'ArrowRight') { cur = (cur+1) % STYLES.length; openViewer(curPage); }
    if (e.key === 'ArrowLeft')  { cur = (cur-1+STYLES.length) % STYLES.length; openViewer(curPage); }
  }
  if (e.key === '/' && document.activeElement !== document.getElementById('q')) { e.preventDefault(); document.getElementById('q').focus(); }
});
document.getElementById('q').addEventListener('input', e => {
  const v = e.target.value.trim().toLowerCase();
  let n = 0;
  document.querySelectorAll('.card').forEach(c => { const hit = !v || c.dataset.name.includes(v); c.classList.toggle('hidden',!hit); if (hit) n++; });
  document.getElementById('count').textContent = n + ' / ' + STYLES.length + ' styles';
});
</script>
</body>
</html>
